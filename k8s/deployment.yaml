apiVersion: apps/v1
kind: Deployment
metadata:
  name: complaintbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: complaintbox
  template:
    metadata:
      labels:
        app: complaintbox
    spec:
      containers:
        - name: complaintbox
          image: complaintbox:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
